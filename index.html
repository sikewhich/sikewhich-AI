<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>ChatGPT-Inspired AI Agent</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            background-color: #121212;\n            color: #ffffff;\n            margin: 0;\n            padding: 0;\n        }\n        #container {\n            display: flex;\n            height: 100vh;\n        }\n        #sidebar {\n            width: 250px;\n            background-color: #1e1e1e;\n            padding: 15px;\n        }\n        #chat-area {\n            flex-grow: 1;\n            padding: 15px;\n            display: flex;\n            flex-direction: column;\n        }\n        #messages {\n            flex-grow: 1;\n            overflow-y: auto;\n            border: 1px solid #444;\n            padding: 10px;\n            margin-bottom: 10px;\n            background-color: #2a2a2a;\n        }\n        input[type='text'] {\n            width: 100%;\n            padding: 10px;\n            border: 1px solid #444;\n            background-color: #2a2a2a;\n            color: #ffffff;\n        }\n        button {\n            padding: 10px;\n            background-color: #007acc;\n            color: white;\n            border: none;\n            cursor: pointer;\n        }\n    </style>\n</head>\n<body>\n    <div id="container">\n        <div id="sidebar">\n            <h2>Navigation</h2>\n            <ul>\n                <li><a href="#">Home</a></li>\n                <li><a href="#">Chat</a></li>\n                <li><a href="#">Settings</a></li>\n            </ul>\n        </div>\n        <div id="chat-area">\n            <div id="messages">\n                <!-- Chat messages will appear here -->\n            </div>\n            <input type="text" id="user-input" placeholder="Type your message here...">\n            <button onclick="sendMessage()">Send</button>\n        </div>\n    </div>\n    <script>\n        function sendMessage() {\n            var inputField = document.getElementById('user-input');\n            var message = inputField.value;\n            if (message.trim() !== '') {\n                var messagesDiv = document.getElementById('messages');\n                messagesDiv.innerHTML += '<div>' + message + '</div>';\n                inputField.value = '';\n                // Here you can add functionality to send the message to the AI agent\n            }\n        }\n    </script>\n</body>\n</html>\n
